services:
  postgres:
    image: postgres:18
    container_name: coffee_shop_postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: coffee_shop
      POSTGRES_USER: coffee_shop
      POSTGRES_PASSWORD: 12345678a

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: