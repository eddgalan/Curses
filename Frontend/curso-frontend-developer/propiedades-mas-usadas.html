<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Propiedades mas usadas</title>
    <style>
        section {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            width: 300px;
            height: 300px;
            background: cornflowerblue;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .card img {
            width: 100%;
        }
        .card p {
            text-align: center;
            margin: 0;
        }
        .card p:nth-child(2) {
            font-size: 1rem;
        }
        .card p:nth-child(3) {
            font-size: 1.5rem;
            color: #FFF;
        }
    </style>
</head>
<body>
<section>
    <div class="card">
        <img src="https://images.pexels.com/photos/315458/pexels-photo-315458.jpeg" alt="Cyberpunk 2077">
        <p>San Francisco</p>
        <p>Visit</p>
    </div>
</section>
</body>
</html>
