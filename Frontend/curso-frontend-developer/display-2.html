<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Display 2 - Flexbox</title>
    <style>
        .container-flex {
            display: flex;
            background: papayawhip;
            justify-content: center;
            align-items: center;
            height: 500px;
            flex-direction: column;
        }
        .container-flex .item {
            width: 30px;
            height: 30px;
            background: purple;
        }
        .container-flex .item:nth-child(2n + 1) {
            background: cyan;
        }
        .container-grid {
            display: grid;
            width: 400px;
            height: 400px;
            background: papayawhip;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
        }
        .container-grid .item {
            background: #61DAFA;
            border: 1px solid purple;
        }
        .container-grid .cross:nth-child(1) {
            grid-column: 1/2;
        }
        .container-grid .cross:nth-child(2) {
            grid-column: 2/3;
            grid-row: 2/3;
        }
        .container-grid .cross:nth-child(3) {
            grid-column: 3/4;
            grid-row: 3/4;
        }
        .container-grid .cross:nth-child(4) {
            grid-column: 4/5;
            grid-row: 4/5;
        }
    </style>
</head>
<body>
<div class="container-flex">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
</div>
<hr>
<div class="container-grid">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
</div>
<hr>
<div class="container-grid">
    <div class="item cross"></div>
    <div class="item cross"></div>
    <div class="item cross"></div>
    <div class="item cross"></div>
</div>
</body>
</html>
