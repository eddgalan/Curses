<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>z-index</title>
    <style>
        div {
            position: absolute;
            background: #A5A5A5;
        }
        .one {
            z-index: 1;
        }
        .two {
            z-index: 2;
        }
        .red {
            width: 100px;
            height: 100px;
            background: red;
            z-index: 5;
        }
        .blue {
            width: 100px;
            height: 100px;
            background: blue;
            z-index: 4;
        }
        .yellow {
            width: 100px;
            height: 100px;
            background: yellow;
            z-index: 6;
        }
    </style>
</head>
<body>
<!--<div class="one">Platzi</div>
<div class="two">Master</div>-->
<section>
    <div class="red">Red</div>
    <div class="blue">Blue
        <div class="yellow">Yellow</div>
    </div>
</section>
</body>
</html>
