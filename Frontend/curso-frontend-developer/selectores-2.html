<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selectores 2</title>
    <style>
      div p {
        color: red;
      }
      div > div {
        background: plum;
      }
      .es {
        color: #FFF;
      }
      main + section {
        background: darkgray;
      }
      main ~ footer {
        background: darkgreen;
      }
    </style>
</head>
<body>
<div>
  <div>
    <p>Platzi</p>
    <div class="es">Es ...</div>
  </div>
  <div>
    <p>Este es un p dentro de un div</p>
  </div>
  <p>Platzi</p>
  <p>Estoy aprendiendo CSS</p>
  <p>Estoy aprendiendo en Platzi</p>
</div>
<main>Master</main>
<section>
  Es lo mejor
</section>
<section>
  Soy el mejor
</section>
<footer>
  Este es el footer
</footer>
</body>
</html>
