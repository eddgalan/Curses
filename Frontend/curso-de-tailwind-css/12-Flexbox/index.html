<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flexbox</title>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body>

<div class="flex justify-center items-center h-screen bg-gray-300">
    <div class="w-32 h-32 bg-blue-400">Elemento 1</div>
    <div class="w-32 h-32 bg-pink-400">Elemento 2</div>
    <div class="w-32 h-32 bg-yellow-400">Elemento 3</div>
</div>
<div class="flex flex-col items-center gap-4 p-4 bg-gray-400">
    <div class="w-32 h-32 bg-blue-400">Elemento 1</div>
    <div class="w-32 h-32 bg-pink-400">Elemento 2</div>
    <div class="w-32 h-32 bg-yellow-400">Elemento 3</div>
</div>
<div class="flex flex-row items-center gap-4 p-4 bg-gray-500">
    <div class="w-32 h-32 bg-blue-400">Elemento 1</div>
    <div class="w-32 h-32 bg-pink-400">Elemento 2</div>
    <div class="w-32 h-32 bg-yellow-400">Elemento 3</div>
</div>
<div class="flex justify-between items-center h-32 px-4 bg-gray-600">
    <div class="w-32 h-32 bg-blue-400 flex items-center justify-center">Elemento 1</div>
    <div class="w-32 h-32 bg-pink-400">Elemento 2</div>
    <div class="w-32 h-32 bg-yellow-400">Elemento 3</div>
</div>
<div class="flex h-32 bg-slate-300">
    <div class="flex-1 bg-blue-400">Elemento 1</div>
    <div class="flex-1 bg-pink-400">Elemento 2</div>
    <div class="flex-none bg-yellow-400">Elemento 3</div>
</div>

</body>
</html>
