<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tipografia con Tailwind CSS</title>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body>
<p class="text-sm">Texto SM</p>
<p class="text-base">Texto Base</p>
<p class="text-lg">Texto LG</p>
<p class="text-xl">Texto Xl</p>
<p class="text-2xl">Texto 2XL</p>
<hr>
<p class="font-thin">Texto Delgado</p>
<p class="font-normal">Texto Delgado</p>
<p class="font-bold">Texto Delgado</p>
<p class="font-extrabold">Texto Delgado</p>
<hr>
<p class="italic">Texto cursivo</p>
<hr>
<p class="text-left">Alinear</p>
<p class="text-center">Center</p>
<p class="text-right">right</p>
<p class="text-justify">Justify</p>
<hr>
<p class="tracking-wide">Espaciado</p>
<p class="tracking-tighter">Espaciado</p>
<p class="tracking-none">Espaciado</p>
<p class="tracking-loose">Espaciado</p>
<hr>
<p class="text-red-500">Rojo</p>
<p class="text-red-600">Rojo</p>
<p class="text-blue-700">Azul</p>
<p class="text-blue-400">Azul</p>
</body>
</html>
