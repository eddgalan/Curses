<!doctype html>
<html lang="en">
<head>

    <title>CSS Grid vs Flexbox</title>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body>
<div class="grid grid-cols-3 gap-4">
    <div class="bg-blue-500 p-4 text-center">Elemento 1</div>
    <div class="bg-pink-500 p-4 text-center">Elemento 2</div>
    <div class="bg-red-500 p-4 text-center">Elemento 3</div>
    <div class="bg-blue-500 p-4 text-center">Elemento 4</div>
    <div class="bg-red-500 p-4 text-center">Elemento 5</div>
</div>
<hr class="my-4">
<div class="grid grid-cols-4 gap-4 mt-8">
    <img src="https://img.magnific.com/premium-vector/rocket-launch-with-pixel-art-vector-illustration_744913-150.jpg?w=150"
         alt="Image 1" class="rounded-lg shadow-lg">
    <img src="https://img.magnific.com/premium-vector/rocket-launch-with-pixel-art-vector-illustration_744913-150.jpg?w=150"
         alt="Image 2" class="rounded-lg shadow-lg">
    <img src="https://img.magnific.com/premium-vector/rocket-launch-with-pixel-art-vector-illustration_744913-150.jpg?w=150"

    <img src="https://img.magnific.com/premium-vector/rocket-launch-with-pixel-art-vector-illustration_744913-150.jpg?w=150"
         alt="Image 4" class="rounded-lg shadow-lg">
    <img src="https://img.magnific.com/premium-vector/rocket-launch-with-pixel-art-vector-illustration_744913-150.jpg?w=150"
         alt="Image 5" class="rounded-lg shadow-lg">
</div>
<hr class="my-4">
<div class="grid grid-cols-4 gap-4">
    <div class="bg-blue-500 p-4 text-center">Elemento 1</div>
    <div class="bg-pink-500 p-4 text-center">Elemento 2</div>
    <div class="bg-red-500 p-4 text-center">Elemento 3</div>
    <div class="bg-sky-500 p-4 text-center">Elemento 4</div>
    <div class="bg-green-500 p-4 text-center col-span-2">Elemento 5</div>
    <div class="bg-yellow-500 p-4 text-center col-span-2">Elemento 6</div>
    <div class="bg-fuchsia-300 p-4 text-center">Elemento 7</div>
    <div class="bg-amber-500 p-4 text-center col-span-3">Elemento 8</div>

</html>
